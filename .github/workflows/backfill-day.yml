name: Backfill Date Range

on:
  workflow_dispatch:
    inputs:
      since:
        description: "Start date to (re)analyze, UTC (YYYY-MM-DD)"
        required: true
        type: string
      until:
        description: "End date, inclusive, UTC (YYYY-MM-DD). Leave blank for 'since' through today."
        required: false
        type: string
      force:
        description: "Overwrite a day's report if one already exists"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Shares the "pages" group with analysis.yml so the two workflows never
# deploy Pages at the same time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Stockfish
        run: sudo apt-get update && sudo apt-get install -y stockfish

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Analyze the requested date range
        env:
          CHESS_USERNAME: ${{ secrets.CHESS_USERNAME }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          STOCKFISH_PATH: stockfish
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          BACKFILL_SINCE: ${{ inputs.since }}
          BACKFILL_UNTIL: ${{ inputs.until }}
          BACKFILL_FORCE: ${{ inputs.force }}
          # Pull the current published state from the live site itself instead of
          # relying on a git-committed copy — no commit/push needed at all this way.
          REMOTE_DATA_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data
        run: |
          ARGS=(--since "$BACKFILL_SINCE" --skip-email --skip-pdf)
          if [ -n "$BACKFILL_UNTIL" ]; then
            ARGS+=(--until "$BACKFILL_UNTIL")
          fi
          if [ "$BACKFILL_FORCE" = "true" ]; then
            ARGS+=(--force)
          fi
          python main.py "${ARGS[@]}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy-pages:
    needs: backfill
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
