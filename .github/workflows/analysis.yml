name: Chess Analysis Pipeline

on:
  schedule:
    # Every hour, on the hour. main.py only fetches games played since the
    # last run (tracked via last_game_end_time in data/analysis.json), so a
    # run with nothing new is a no-op and a run with new games since the last
    # one groups them into a single fresh report.
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # apt-get update (refreshing every package list) is usually the slow
      # part of installing Stockfish, not the download itself — caching the
      # installed binary skips both on a hit. Bump the "v1" tag if this ever
      # needs to be invalidated (e.g. after intentionally upgrading Stockfish).
      - name: Cache Stockfish
        id: cache-stockfish
        uses: actions/cache@v4
        with:
          path: /usr/games/stockfish
          key: stockfish-${{ runner.os }}-v1

      - name: Install Stockfish
        if: steps.cache-stockfish.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y stockfish

      # Fails fast with a clear error if the binary ever isn't where expected
      # (cache restore gone wrong, apt changing its install path, etc.)
      # rather than failing deep inside main.py's chess.engine.popen_uci
      # call. Deliberately checks the absolute path, not PATH resolution —
      # verified directly (via a real Ubuntu container, not assumed) that
      # /usr/games is NOT on $PATH for GitHub Actions' non-login `run:`
      # shell, even though that's genuinely where apt installs the package.
      - name: Verify Stockfish is available
        run: test -x /usr/games/stockfish

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run analysis pipeline
        env:
          CHESS_USERNAME: ${{ secrets.CHESS_USERNAME }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          STOCKFISH_PATH: /usr/games/stockfish
          GAMES_LIMIT: ${{ vars.GAMES_LIMIT }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # Pull the current published state from the live site itself instead of
          # relying on a git-committed copy — no commit/push needed at all this way.
          REMOTE_DATA_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data
        run: python main.py --skip-email --skip-pdf

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy-pages:
    needs: analyze
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
